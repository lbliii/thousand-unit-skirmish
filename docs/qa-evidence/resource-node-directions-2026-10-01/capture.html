<!doctype html><html><base href="/"><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script><body style="margin:0"><script type="module">
import * as THREE from 'three';
import * as environment from '/src/environment-art.mjs';
const scene=new THREE.Scene();scene.background=new THREE.Color('#50583e');
const positions=Array.from({length:32},(_,i)=>({x:(i%8-3.5)*3,z:(Math.floor(i/8)-1.5)*4,scale:1}));

for(let i=0;i<32;i++){const h=Math.round(rects.getX(i)*4)+Math.round((1-rects.getY(i)-.5)*2)*4;counts[h]=(counts[h]||0)+1;}

await save('renderer-proof.json',JSON.stringify({instances:32,counts,rootReset:true,atlasPreservedAfterLifecycleLoad:true},null,2));await save('headings.png',await new Promise(r=>renderer.domElement.toBlob(r)));window.__renderDone=true;
</script></body></html>
